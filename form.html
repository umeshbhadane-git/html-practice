<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>

    <header>
        <h1>JOB APPLICATION FORM</h1>
    </header>

    <main>
        <form action="welcome.html" method="GET" enctype="multipart/form-data">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="firstName">First Name:</label>
                <input type="text" 
                        id="firstName" 
                        name="firstName" 
                        required minlength="3" 
                        maxlength="10" 
                        autocomplete="given-name" 
                        placeholder="Enter your first name" 
                        autofocus>
                        
                <br><br>

                <label for="lastName">Last Name:</label>
                <input type="text" 
                       id="lastName" 
                       name="lastName" 
                       required minlength="3" 
                       maxlength="10" 
                       autocomplete="family-name" 
                       placeholder="Enter your last name" 
                       autofocus>

                <br><br>

                <label for = "email">Email:</label>
                <input type="email"
                       id="email"
                       name="email"
                       required
                       pattern="^[a-zA-Z0-9.]+@gmail\.com$"
                       placeholder="xyz@gmail.com"
                       autocomplete="email">

                <br><br>

                <label for="age">Age:</label>
                <input type="number"
                       id="age"
                       name="age"
                       required
                       min="18"
                       max="100"
                       placeholder="age"
                       autocomplete="age">

                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" 
                       id="dob" 
                       name="dob" 
                       required>

                <br><br>

                <label for="gender">Gender:</label>
                <input type="radio" id="male" name="gender" value="male" required>  
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>

            </fieldset>

            <br><br>

            <fieldset>
                <legend>Create Password</legend>

                    <label for="password">Password:</label>
                    <input type="password" 
                        id="password" 
                        name="password" 
                        required 
                        autocomplete="new-password" 
                        placeholder="Enter your password" 
                        minlength="8" 
                        maxlength="20">

                    <br><br>

                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            required 
                            autocomplete="new-password" 
                            placeholder="Confirm your password" 
                            minlength="8" 
                            maxlength="20">

            </fieldset>

            <br><br>

            <fieldset>
                <legend>Upload Resume</legend>

                <label for="resume">Resume:</label>
                <input type="file"
                       id="resume"
                       name="resume"
                       required
                       accept=".pdf,.doc,.docx">

            </fieldset>

            <br><br> 

            <fieldset>
                <legend>Skills</legend>

                <p> *Press <code>CTRL</code> to select multiple options</p>

                <label for="skills">Select your skills:</label><br>

                <select id="skills" name="skills" multiple required size="10"> 

                    <optgroup label="Frontend Languages Known">
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>
                        <option value="react">React</option>
                        <option value="angular">Angular</option>
                        <option value="Next">Next.js</option>
                    </optgroup>

                    <optgroup label="Backend Languages Known">
                        <option value="java">Java</option>
                        <option value="spring-boot">Spring Boot</option>
                        <option value="nodejs">Node.js</option>
                    </optgroup>

                    <optgroup label="Database Technologies Known">
                        <option value="mysql">MySQL</option>
                        <option value="postgresql">PostgreSQL</option>
                        <option value="mongodb">MongoDB</option>
                    </optgroup>

                </select>
            </fieldset>

            <br><br>

            <fieldset>
                <legend>Experience Level</legend>

                <label for="experience"> Years of programming experience: </label> 
                <input type="range" 
                       id="experience"
                       name="experience" 
                       min="0" 
                       max="20" 
                       step="1" 
                       value="0"
                       oninput="experienceValue.value = this.value"> 
                <output id="experienceValue">0 </output> years
            </fieldset>

            <br><br>

            <fieldset>
                <legend>Additional Information</legend>

                <label for="additionalInfo"><strong> Work experience/projects/Internship:</strong> </label><br>
                <textarea id="additionalInfo"
                          name="additionalInfo"
                          rows="4"
                          cols="50"
                          placeholder="Enter any additional information here...">
                </textarea>
            </fieldset>

            <br><br>

            <fieldset>
                <legend>Terms and Conditions</legend>
                <label for="terms">I agree to the terms and conditions:</label>
                <input type="checkbox" 
                       id="terms" 
                       name="terms" 
                       required>
            </fieldset>

            <br><br>

            <a href="welcome.html">
                <button type="submit">Submit Form</button>
            </a>
    
            
        </form>
    </main>

    <footer>
        <p>&copy; 2026 HTML Practice</p>
    </footer>
    
</body>
</html>
